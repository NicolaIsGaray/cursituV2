<nav class="top-nav">
  <button class="btn-back" (click)="goBack()">
    <span class="material-symbols-outlined">arrow_back</span>
    Regresar
  </button>
</nav>
<main *ngIf="authService.userRole$ | async as rol">
  <div class="gestion-tps-container" *ngIf="rol === 'DOCENTE'">
    <main class="tps-panel">
      <header class="panel-header">
        <h2>Gestión de Trabajos Prácticos</h2>
      </header>

      <div class="tp-list">
        @for (task of taskList$ | async; track task.id) {
          <article class="tp-card" [style.border-left-color]="currentSubject.color">
            <div class="tp-header">
              <div class="tp-title-area">
                <h3>{{task.title}}</h3>
                <div class="deadline-badge">
                  <span class="material-symbols-outlined">schedule</span>
                  <span>Límite: {{formatDate(task.date_limit)}}</span>
                </div>
              </div>
              <div class="tp-actions">
                <button class="btn-icon edit" title="Editar"><span class="material-symbols-outlined">edit</span></button>
                <button class="btn-icon delete" title="Eliminar"><span class="material-symbols-outlined">delete</span></button>
              </div>
            </div>
  
            <div class="tp-stats-grid">
              <div class="stat-item">
                <span class="count">28/32</span>
                <span class="label">ENTREGADOS</span>
              </div>
              <div class="stat-item">
                <span class="count success">12</span>
                <span class="label">CORREGIDOS</span>
              </div>
              <div class="stat-item">
                <span class="count warning">4</span>
                <span class="label">NO ENTREGADOS</span>
              </div>
            </div>
  
            <div class="tp-footer">
              <div class="attachment-box">
                <span class="material-symbols-outlined">description</span>
                <span class="filename">Leer Consigna</span>
              </div>
              <a class="btn-ver-entregas" routerLink="/see-deliveries">
                Ver Entregas
                <span class="material-symbols-outlined">chevron_right</span>
              </a>
            </div>
          </article>
        }
      </div>
    </main>
  </div>
</main>
