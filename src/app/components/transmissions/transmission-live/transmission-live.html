<div class="live-container">
  <header class="live-header">
    <div class="header-left">
      <span class="brand">CursITU</span>
    </div>

    <div class="header-center">
      <div class="live-indicator">
        <span class="dot"></span>
        <span class="live-text">EN VIVO</span>
      </div>
      <div class="divider"></div>
      <span class="group-name">Grupo #2 – Arquitectura de Software</span>
    </div>

    <div class="header-right">
      <button class="btn-exit" (click)="salirDeTransmision()">
        <span>Salir</span>
        <span class="material-symbols-outlined">logout</span>
      </button>
    </div>
  </header>

  <main class="viewer-area">
    <div class="slide-aspect-ratio">
      <div class="slide-content">
        <img [src]="slides[currentSlideIndex]" alt="Diapositiva Actual" class="slide-image" />
      </div>

      <div class="slide-controls">
        <button class="control-btn" (click)="prevSlide()" [disabled]="currentSlideIndex === 0">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>

        <span class="slide-counter"> {{ currentSlideIndex + 1 }} / {{ slides.length }} </span>

        <button
          class="control-btn"
          (click)="nextSlide()"
          [disabled]="currentSlideIndex === slides.length - 1"
        >
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="live-footer">
    <div class="viewer-count">
      <span class="material-symbols-outlined">group</span>
      <span>{{ espectadoresCount }} espectadores</span>
    </div>
  </footer>
</div>
